# $XDG_CONFIG_HOME/anchorage/config.ini  (usually ~/.config/anchorage/config.ini)
# Every key is optional. Restart Anchorage to apply changes. Keybindings live in keybindings.ini.

[window]
# Default window size in logical px (width 1280 – 8192, height 720 – 8192)
width = 1280
height = 720

[view]
# Text shown in the window
greeting = Hello

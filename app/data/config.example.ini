# $XDG_CONFIG_HOME/anchorage/config.ini  (usually ~/.config/anchorage/config.ini)
# Every key is optional. Restart Anchorage to apply changes. Keybindings live in keybindings.ini.

[window]
# Window size in logical px when not fullscreen (width 1280 – 8192, height 720 – 8192)
width = 1280
height = 720
# Fullscreen: auto (fullscreen in Game Mode and when Steam starts Anchorage, else a
# window), true or false
fullscreen = auto

[appearance]
# Catppuccin flavour: latte, frappe, macchiato or mocha
flavor = mocha
# Accent colour: rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green,
# teal, sky, sapphire, blue or lavender
accent = mauve

[roms]
# The folder Anchorage looks in for your ROMs (.z64, .n64, .v64 or .zip). It is only read.
# Separate several folders with ';': they are scanned in order, the first match wins.
# Unset, Anchorage finds it (EmuDeck, RetroDECK, the SD card) or you choose folders in the
# app; set here, it wins over the app.
directory = ~/Roms/n64

[ports]
# Check for port updates when Anchorage starts (true or false)
check_updates = true

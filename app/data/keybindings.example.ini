# $XDG_CONFIG_HOME/anchorage/keybindings.ini  (usually ~/.config/anchorage/keybindings.ini)
# Every binding is optional: one left out keeps its default keys. Restart Anchorage to apply changes.

[keybindings]
# A key is Ctrl+ Shift+ Alt+ Super+ then a Godot key name (Enter, Escape, Up, Q, F4 ...),
# or a gamepad input: Pad:A B X Y Back Guide Start LeftStick RightStick LeftShoulder
# RightShoulder DPadUp DPadDown DPadLeft DPadRight, Pad:LeftStickUp (also Down, Left,
# Right and the Right stick), Pad:LeftTrigger, Pad:RightTrigger.
# Separate several bindings with ';'. Leave a value empty to unbind. Defaults shown.
up = Up;Pad:DPadUp;Pad:LeftStickUp
down = Down;Pad:DPadDown;Pad:LeftStickDown
left = Left;Pad:DPadLeft;Pad:LeftStickLeft
right = Right;Pad:DPadRight;Pad:LeftStickRight
accept = Enter;Pad:A
back = Escape;Pad:B
# The focused port's menu: Play, Check for updates, Remove
options = O;Pad:Y
# Check for updates and rescan the ROM folder
refresh = F5;Pad:X
quit = Ctrl+Q
